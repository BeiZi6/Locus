name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Build
        run: |
          swift --version
          swift build -c release

      - name: Assemble app
        run: |
          APP=dist/Locus.app
          VENV="$APP/Contents/Resources/.venv"
          rm -rf dist
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp .build/release/Locus "$APP/Contents/MacOS/Locus"
          cp Info.plist "$APP/Contents/Info.plist"
          cp Resources/Locus.icns "$APP/Contents/Resources/Locus.icns"

          # Bridge.swift 先查 Resources/.venv，再从可执行文件向上找 .venv/bin/python，以 <root>/src 作 PYTHONPATH。
          # 把可搬迁的 Python 和 src 放进 Contents/Resources，由 projectRoot 优先检查。
          uv python install 3.12
          PY="$(uv python find 3.12)"
          ROOT="$("$PY" -c 'import sys; print(sys.base_prefix)')"
          case "$ROOT" in "$(uv python dir)"/*) ;; *) echo "not a uv-managed Python: $ROOT"; exit 1 ;; esac
          ditto "$ROOT" "$VENV"
          rm -f "$VENV"/lib/python3.12/EXTERNALLY-MANAGED
          [ -e "$VENV/bin/python" ] || ln -s python3 "$VENV/bin/python"

          uv export --frozen --no-dev --no-hashes --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$VENV/bin/python" -r "$RUNNER_TEMP/requirements.txt"
          ditto src "$APP/Contents/Resources/src"

          rm -rf "$VENV"/lib/python3.12/test "$VENV"/lib/python3.12/idlelib \
            "$VENV"/lib/python3.12/turtledemo "$VENV"/lib/python3.12/tkinter \
            "$VENV"/include "$VENV"/share
          find "$APP/Contents" -name __pycache__ -type d -prune -exec rm -rf {} +

          # arm64 的 Mach-O 必须带签名才能加载，先签内层再签 app
          find "$VENV" -type f | while read -r f; do
            if file -b "$f" | grep -q Mach-O; then
              codesign --force --sign - "$f"
            fi
          done
          codesign --force --sign - "$APP"
          du -sh "$APP"

      - name: Smoke test
        run: |
          mkdir "$RUNNER_TEMP/relocated"
          ditto dist/Locus.app "$RUNNER_TEMP/relocated/Locus.app"
          APP="$RUNNER_TEMP/relocated/Locus.app"
          PYTHONPATH="$APP/Contents/Resources/src" "$APP/Contents/Resources/.venv/bin/python" -I -c \
            'import sys; sys.path.insert(0, sys.argv[1]); import locus.worker, pymobiledevice3.lockdown, pymobiledevice3.services.dvt.instruments.dvt_provider; print(sys.version)' \
            "$APP/Contents/Resources/src"
          codesign --verify --deep --strict "$APP"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="Locus-${GITHUB_REF_NAME}-macOS-$(uname -m).zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Locus.app "$ZIP"
          cat > notes.md <<'EOF'
          ## 安装

          1. 下载 zip，解压得到 `Locus.app`，拖进「应用程序」。
          2. 这个 app 没有 Apple 开发者签名，第一次打开会被 Gatekeeper 拦下。在终端执行一次：
             ```sh
             xattr -cr /Applications/Locus.app
             ```
             或者在「系统设置 → 隐私与安全性」里点「仍要打开」。

          ## 要求

          - Apple 芯片的 Mac，macOS 14 及以上。
          - iOS 17 及以上需要开启开发者模式，并用数据线连接后信任这台 Mac。
          - Android 需要已启动的 adb，并允许模拟位置。
          EOF
          gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Locus $GITHUB_REF_NAME" --notes-file notes.md
